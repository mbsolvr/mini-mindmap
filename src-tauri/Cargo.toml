[package]
name = "mini-mindmap"
version = "0.1.0"
description = "A local-first mind map app."
edition = "2021"
license = "LGPL-3.0-only"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", default-features = false, features = ["wry", "compression", "image-png"] }
tauri-plugin-clipboard-manager = "=2.4.0"
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.23.1"

[patch.crates-io]
option-ext = { path = "vendor/option-ext" }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "=2.5.5"
